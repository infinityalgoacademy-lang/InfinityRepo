# Share cards for this site's share links: the card image behind /r/<owner>/<name> on the site.
# Deploy with `cd share && npx wrangler deploy`; it answers on https://<worker>.<your-subdomain>.workers.dev.
# Put that origin in share/cards.json ("cards") so the preview pages point their og:image at it.
# SITE is the deployment whose data.json / vitals.json / fit.json the cards are drawn from.
name = "infinityrepo-share"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE = "https://infinityrepo.pages.dev"

# On a domain of your own, serve the shared links there too by adding a custom domain:
# routes = [{ pattern = "r.example.com", custom_domain = true }]
